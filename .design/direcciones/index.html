<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direcciones · You and me</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #2b2b2b; color: #eee; }
  header { display: flex; gap: 16px; align-items: center; padding: 14px 20px; position: sticky; top: 0; background: #1d1d1d; z-index: 2; }
  h1 { font-size: 16px; margin: 0; flex: 1; }
  button { font: inherit; min-height: 40px; padding: 0 16px; border: 1px solid #777; background: #333; color: #eee; cursor: pointer; }
  button[aria-pressed='true'] { background: #eee; color: #111; }
  main { display: flex; gap: 24px; padding: 20px; overflow-x: auto; }
  figure { margin: 0; flex: none; }
  figcaption { padding-bottom: 8px; font-weight: 600; }
  iframe { width: 390px; height: 2700px; border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<header>
  <h1>You and me · dirección elegida: Nuestro mar (maqueta estática, contenido de ejemplo)</h1>
  <button data-tema="claro" aria-pressed="true">Claro</button>
  <button data-tema="oscuro" aria-pressed="false">Oscuro</button>
</header>
<main>
  <figure><figcaption>4 · Nuestro mar (tu estilo, mejorado)</figcaption><iframe data-src="4-nuestro-mar.html" title="Nuestro mar"></iframe></figure>
</main>
<script>
  const poner = (t) => {
    document.querySelectorAll('iframe').forEach((f) => { f.src = f.dataset.src + '?tema=' + t; });
    document.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tema === t));
  };
  document.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => poner(b.dataset.tema)));
  poner('claro');
</script>
</body>
</html>
