<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="You & me" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6B4F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1814" media="(prefers-color-scheme: dark)" />
    <title>You and me 💚</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600;700;800&display=swap" />
    <!-- Tema escogido en la app (src/lib/tema.ts): se aplica antes de pintar para que no parpadee -->
    <script>try{var t=localStorage.getItem('tema');if(t==='claro'||t==='oscuro'){document.documentElement.dataset.tema=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='oscuro'?'#0D1814':'#2F6B4F'})}}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
